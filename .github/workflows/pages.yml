name: Deploy catalog site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/recommended-skills.json"
      - "data/prompts.json"
      - "data/html-report-skills.json"
      - "prompts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build static artifact
        run: |
          mkdir _site
          cp docs/index.html _site/index.html
          cp docs/prompts.html _site/prompts.html
          cp docs/html-reports.html _site/html-reports.html
          cp data/recommended-skills.json _site/skills.json
          cp data/prompts.json _site/prompts.json
          cp data/html-report-skills.json _site/html-report-skills.json
          mkdir -p _site/prompts
          cp prompts/*.prompt.md _site/prompts/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
