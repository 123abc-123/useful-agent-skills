name: Deploy catalog site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "content/data/recommended-skills.json"
      - "content/data/prompts.json"
      - "content/data/tools/**"
      - "content/prompts/**"
      - "tooling/scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build static artifact
        run: |
          python tooling/scripts/build_catalog.py
          mkdir _site
          cp -r site/. _site/
          cp content/data/recommended-skills.json _site/skills.json
          cp content/data/prompts.json _site/prompts.json
          mkdir -p _site/data/tools
          cp -r content/data/tools/. _site/data/tools/
          mkdir -p _site/prompts
          cp content/prompts/*.prompt.md _site/prompts/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
