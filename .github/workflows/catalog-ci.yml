name: Catalog CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate catalog and local skills
        run: python tooling/scripts/validate_catalog.py
      - name: Check generated Tools pages
        run: python tooling/scripts/build_catalog.py --check
      - name: Check external links
        run: python tooling/scripts/check_links.py --timeout 15 --workers 8
