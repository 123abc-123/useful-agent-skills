<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="面向算法工程师的可搜索 Prompt Library">
  <title>Algorithm Engineering Prompt Library</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #647084;
      --line: #dce2ea;
      --paper: #f5f7fa;
      --card: #fff;
      --accent: #6d28d9;
      --accent-soft: #f0e8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    header {
      padding: 52px max(24px, calc((100vw - 1120px) / 2));
      color: #fff;
      background: linear-gradient(135deg, #32105f, #6d28d9 62%, #a855f7);
    }
    h1 { margin: 0 0 8px; font-size: clamp(30px, 5vw, 50px); letter-spacing: -.04em; }
    header p { max-width: 760px; margin: 0; color: #eee5ff; font-size: 17px; }
    nav { margin-top: 18px; display: flex; gap: 16px; }
    nav a { color: #fff; }
    main { max-width: 1120px; margin: 0 auto; padding: 28px 24px 64px; }
    .intro { margin: 0 0 22px; color: var(--muted); }
    .controls {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(160px, 240px);
      gap: 12px;
      margin-bottom: 16px;
    }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
    }
    .summary { margin: 12px 0 20px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    article {
      display: flex;
      flex-direction: column;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--card);
      box-shadow: 0 7px 24px rgba(23, 32, 51, .05);
    }
    article h2 { margin: 0 0 8px; font-size: 18px; }
    article p { flex: 1; margin: 0 0 14px; color: var(--muted); }
    .actions { display: flex; align-items: center; gap: 13px; }
    button {
      padding: 7px 11px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #d8b4fe; outline-offset: 2px; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .tag { padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: #5b21b6; font-size: 12px; }
    a { color: var(--accent); text-decoration: none; font-weight: 650; }
    a:hover { text-decoration: underline; }
    .empty { padding: 36px; text-align: center; color: var(--muted); }
    footer { margin-top: 36px; color: var(--muted); }
    @media (max-width: 680px) { .controls { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Prompt Library</h1>
    <p>10 个面向算法工程的原创模板。每个模板都有输入变量、证据要求、输出结构和回归边界。</p>
    <nav aria-label="目录导航"><a href="./index.html">Skills</a><a href="./prompts.html">Prompt Library</a><a href="./tools/">Tools</a><a href="https://github.com/123abc-123/useful-agent-skills">GitHub</a></nav>
  </header>
  <main>
    <p class="intro">Prompt 适合明确的一次性任务；需要 Agent 自动识别并稳定执行的长期流程，可以进一步写成 Skill。</p>
    <div class="controls" aria-label="筛选器">
      <input id="query" type="search" placeholder="搜索名称、用途或变量" aria-label="搜索">
      <select id="category" aria-label="分类"><option value="">全部分类</option></select>
    </div>
    <div id="summary" class="summary">正在读取 Prompt…</div>
    <section id="grid" class="grid" aria-live="polite"></section>
    <footer>
      模板索引来自 <a href="https://github.com/123abc-123/useful-agent-skills/blob/main/data/prompts.json">prompts.json</a>。
      <a href="https://github.com/123abc-123/useful-agent-skills/blob/main/catalog/prompt-libraries.md">查看开源 Prompt 资源</a>。
    </footer>
  </main>
  <script>
    let prompts = [];
    const query = document.querySelector("#query");
    const category = document.querySelector("#category");
    const grid = document.querySelector("#grid");
    const summary = document.querySelector("#summary");

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[character]);
    }

    function promptUrl(prompt) {
      return "https://github.com/123abc-123/useful-agent-skills/blob/main/" + prompt.path;
    }

    function render() {
      const term = query.value.trim().toLowerCase();
      const filtered = prompts.filter(prompt => {
        const text = (prompt.name + " " + prompt.purpose + " " + prompt.variables.join(" ")).toLowerCase();
        return (!term || text.includes(term)) &&
          (!category.value || prompt.category === category.value);
      });
      summary.textContent = "显示 " + filtered.length + " / " + prompts.length + " 个模板。";
      grid.innerHTML = filtered.map(prompt =>
        '<article>' +
          '<h2>' + escapeHtml(prompt.name) + '</h2>' +
          '<p>' + escapeHtml(prompt.purpose) + '</p>' +
          '<div class="meta"><span class="tag">' + escapeHtml(prompt.category) + '</span>' +
          prompt.variables.map(variable => '<span class="tag">{{' + escapeHtml(variable) + '}}</span>').join("") +
          '</div><div class="actions"><button type="button" data-path="' + escapeHtml(prompt.path) + '">复制模板</button>' +
          '<a href="' + promptUrl(prompt) + '">查看源码</a></div>' +
        '</article>'
      ).join("") || '<div class="empty">没有符合条件的 Prompt。</div>';
      grid.querySelectorAll("button[data-path]").forEach(button => {
        button.addEventListener("click", () => copyPrompt(button));
      });
    }

    function copyPrompt(button) {
      const original = button.textContent;
      fetch("./" + button.dataset.path)
        .then(response => {
          if (!response.ok) throw new Error(response.status);
          return response.text();
        })
        .then(content => navigator.clipboard.writeText(content))
        .then(() => {
          button.textContent = "已复制";
          window.setTimeout(() => { button.textContent = original; }, 1600);
        })
        .catch(() => {
          button.textContent = "复制失败";
          window.setTimeout(() => { button.textContent = original; }, 1600);
        });
    }

    fetch("./prompts.json")
      .then(response => {
        if (!response.ok) throw new Error(response.status);
        return response.json();
      })
      .then(data => {
        prompts = data.prompts;
        [...new Set(prompts.map(prompt => prompt.category))].sort().forEach(value => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          category.appendChild(option);
        });
        render();
      })
      .catch(() => {
        summary.textContent = "Prompt 读取失败，请前往 GitHub 查看原始数据。";
      });
    [query, category].forEach(element => element.addEventListener("input", render));
  </script>
</body>
</html>
